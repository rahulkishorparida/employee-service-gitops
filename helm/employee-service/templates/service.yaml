apiVersion: v1
kind: Service
metadata:
  name: employee-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: employee-service

spec:
  type: ClusterIP

  selector:
    app: employee-service

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP