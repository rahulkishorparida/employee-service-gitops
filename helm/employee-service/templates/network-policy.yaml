apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: employee-default-deny
  namespace: {{ .Release.Namespace }}

spec:
  podSelector:
    matchLabels:
      app: employee-service

  policyTypes:
    - Ingress

---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: employee-allow-ingress-nginx
  namespace: {{ .Release.Namespace }}

spec:
  podSelector:
    matchLabels:
      app: employee-service

  policyTypes:
    - Ingress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx

      ports:
        - protocol: TCP
          port: 8080

