{{- if .Values.alerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: {{ include "employee.fullname" . }}-alerts
  namespace: {{ .Release.Namespace }}

  labels:
    release: kube-prometheus-stack

spec:
  groups:
    - name: {{ include "employee.fullname" . }}.alerts

      rules:
        - alert: EmployeeServiceHigh5xxRate

          expr: |
            (
              sum(
                rate(
                  istio_requests_total{
                    destination_service=~"employee-service.*",
                    response_code=~"5.."
                  }[5m]
                )
              )
              /
              sum(
                rate(
                  istio_requests_total{
                    destination_service=~"employee-service.*"
                  }[5m]
                )
              )
            ) > 0.05

          for: 5m

          labels:
            severity: critical
            team: application
            environment: {{ .Values.environment }}
            service: employee-service

          annotations:
            summary: "Employee service has high 5xx error rate"
            description: >
              Employee service has more than 5% HTTP 5xx errors
              for 5 minutes.
{{- end }}